# Polytropic heat pump — transparent Modbus RTU-over-TCP bridge
# Speaks the raw wire protocol hass-polytropic-heatpump expects (RTU+CRC
# over plain TCP), replacing the Waveshare RS485-to-ETH gateway.
#
# Architecture :
#   HA integration --TCP:8899 (raw RTU+CRC)--> uart_tcp_server
#     -> uart_bridge -> uart GPIO0/GPIO1 -> SP3485 -> A/B -> heat pump (slave 17)
#
# Before flashing:
#   1. Set uart_baud / parity / stop_bits to match the heat pump's Modbus
#      settings (commonly 9600 8N1 — verify against the unit's manual or an
#      existing gateway config if available).
#   2. Optional: enable wifi manual_ip below for a stable address, or set a
#      DHCP reservation for the Pico's MAC. Either way, note the IP for the
#      HA integration setup (port 8899, slave 17).
#   3. Confirm the Pico-2CH-RS485 uses auto DE/RE direction (schematic check).
#      If DE/RE are GPIO-driven, uart_bridge cannot toggle them — see plan.

substitutions:
  name: heatpump-bridge
  # Match the heat pump's Modbus settings (common default: 9600 8N1)
  uart_baud: "9600"
  # hass-polytropic-heatpump config-flow defaults
  tcp_port: "8899"

esphome:
  name: ${name}
  friendly_name: Heat Pump Bridge

rp2:
  board: rpipico2w

logger:
  # Logs go to USB-CDC by default on Pico. Do NOT let the logger claim
  # UART0 (GPIO0/GPIO1) — those pins are the RS485 channel.
  # If validation reports a UART0 clash, set: hardware_uart: USB_CDC
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Optional: pin the bridge to a fixed address (or use a DHCP reservation).
  # Then use that IP as the host when adding the integration in HA

  # Fallback hotspot if WiFi is down
  ap:
    password: !secret ap_password

api:

ota:
  - platform: esphome

# Makes the WiFi-AP fallback usable for field reconfiguration
captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/nebulous/esphome-uart-link

# Hardware UART — Waveshare Pico-2CH-RS485 channel 0
#   CH0: TX_CH0 = GP0, RX_CH0 = GP1 (wiki pinout)
uart:
  id: hp_uart
  tx_pin: GPIO0
  rx_pin: GPIO1
  baud_rate: ${uart_baud}
  data_bits: 8
  stop_bits: 1
  parity: NONE
  # Hex-dump every byte on the wire (TX+RX) at DEBUG level
  debug:

# Raw TCP server speaking the same wire protocol the integration expects:
# Modbus RTU frames (with CRC) over plain TCP — NOT Modbus TCP/MBAP.
uart_tcp_server:
  id: hp_tcp
  port: ${tcp_port}
  # exclusive: one client owns the bus at a time. The integration opens a
  # fresh connection per poll cycle, so this matches its command-response
  # pattern and keeps a stray debug nc session from interleaving frames.
  client_mode: exclusive
  max_clients: 2
  # Explicit sizes: uart-link only documents defaults for ESP32/ESP8266.
  rx_buffer_size: 4096
  tx_buffer_size: 4096

# Transparent byte pipe: TCP clients <-> RS485 UART
uart_bridge:
  uarts: [hp_uart, hp_tcp]
  buffer_size: 512
